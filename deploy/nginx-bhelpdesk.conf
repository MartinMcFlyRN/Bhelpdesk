# /etc/nginx/sites-available/bhelpdesk.conf
# Adjust server_name, certificates, paths and PHP-FPM socket.

# IPs allowed into the operators area live in a separate file,
# so you can update them without touching the vhost:
#   /etc/nginx/snippets/bhelpdesk-op-allow.conf  (see example file)

server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name helpdesk.example.com;

    ssl_certificate     /etc/letsencrypt/live/helpdesk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.example.com/privkey.pem;

    root /var/www/bhelpdesk/public;
    index index.php;

    client_max_body_size 10m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/bhelpdesk.access.log;
    error_log  /var/log/nginx/bhelpdesk.error.log;

    # / -> customers area
    location = / {
        return 302 /customer/;
    }

    # ---------- Customers area (public) ----------
    location = /customer {
        return 301 /customer/;
    }
    location ^~ /customer/ {
        try_files $uri /customer/index.php$is_args$args;

        location = /customer/index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.3-fpm-bhelpdesk.sock;
        }
        location ~ \.php$ {
            return 404;
        }
    }

    # ---------- Operators area (IP filtered) ----------
    location = /op {
        include snippets/bhelpdesk-op-allow.conf;
        return 301 /op/;
    }
    location ^~ /op/ {
        include snippets/bhelpdesk-op-allow.conf;

        try_files $uri /op/index.php$is_args$args;

        location = /op/index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.3-fpm-bhelpdesk.sock;
        }
        location ~ \.php$ {
            return 404;
        }
    }

    # ---------- Static files ----------
    location ^~ /assets/ {
        expires 7d;
        access_log off;
    }

    # No other PHP is executable, no dotfiles
    location ~ /\. {
        deny all;
    }
    location ~ \.php$ {
        return 404;
    }
}
