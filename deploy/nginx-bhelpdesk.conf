# /etc/nginx/sites-available/bhelpdesk.conf
# Adatta server_name, certificati, path e socket PHP-FPM.

# Lista IP ammessi all'area operatori: tienila in un file separato
# così la aggiorni senza toccare il vhost.
#   /etc/nginx/snippets/bhelpdesk-op-allow.conf  (vedi file di esempio)

server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.example.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name helpdesk.example.it;

    ssl_certificate     /etc/letsencrypt/live/helpdesk.example.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.example.it/privkey.pem;

    root /var/www/bhelpdesk/public;
    index index.php;

    client_max_body_size 10m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/bhelpdesk.access.log;
    error_log  /var/log/nginx/bhelpdesk.error.log;

    # / -> area clienti
    location = / {
        return 302 /customer/;
    }

    # ---------- Area clienti (pubblica) ----------
    location = /customer {
        return 301 /customer/;
    }
    location ^~ /customer/ {
        try_files $uri /customer/index.php$is_args$args;

        location = /customer/index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.3-fpm-bhelpdesk.sock;
        }
        location ~ \.php$ {
            return 404;
        }
    }

    # ---------- Area operatori (filtrata per IP) ----------
    location = /op {
        include snippets/bhelpdesk-op-allow.conf;
        return 301 /op/;
    }
    location ^~ /op/ {
        include snippets/bhelpdesk-op-allow.conf;

        try_files $uri /op/index.php$is_args$args;

        location = /op/index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.3-fpm-bhelpdesk.sock;
        }
        location ~ \.php$ {
            return 404;
        }
    }

    # ---------- Statici ----------
    location ^~ /assets/ {
        expires 7d;
        access_log off;
    }

    # Nessun altro PHP eseguibile, niente dotfile
    location ~ /\. {
        deny all;
    }
    location ~ \.php$ {
        return 404;
    }
}
