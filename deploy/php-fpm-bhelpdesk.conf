; /etc/php/8.3/fpm/pool.d/bhelpdesk.conf
; Dedicated pool with its own user: isolates the app from other sites on the server.

[bhelpdesk]
user = bhelpdesk
group = bhelpdesk

listen = /run/php/php8.3-fpm-bhelpdesk.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[open_basedir] = /var/www/bhelpdesk/:/tmp/:/var/lib/php/sessions-bhelpdesk/
php_admin_value[session.save_path] = /var/lib/php/sessions-bhelpdesk
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php/bhelpdesk-error.log
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
