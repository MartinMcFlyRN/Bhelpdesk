# /etc/nginx/snippets/bhelpdesk-op-allow.conf
# IPs / networks allowed into /op. Everything else gets 403.
# After a change: nginx -t && systemctl reload nginx

allow 127.0.0.1;
allow ::1;
# allow 203.0.113.10;      # office
# allow 198.51.100.0/24;   # company network
# allow 2001:db8::/48;
deny  all;
